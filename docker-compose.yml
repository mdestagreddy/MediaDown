# docker-compose.yml
# Production deployment with Docker
# Run: docker-compose up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediabot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MAX_CONCURRENT=4
      - NODE_ENV=production
    volumes:
      - ./downloads:/app/downloads
      - ./backend/.env:/app/.env
    networks:
      - mediabot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
    container_name: mediabot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    networks:
      - mediabot

  nginx:
    image: nginx:alpine
    container_name: mediabot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - mediabot

networks:
  mediabot:
    driver: bridge
